<!doctype html>
<!--mare-app-->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Maré · Seu ciclo menstrual</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0ABAB5"><link rel="icon" type="image/png" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Maré"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--t:#0ABAB5;--t2:#81D8D0;--tl:#E3F8F6;--td:#06706C;--bg:#F2FCFB;--card:#fff;--tx:#0F3D3B;--mu:#5C8582;--pk:#FF8FA3;--bd:#CDEEEB;--wr:#E1F3FB;--wt:#0F3D3B;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#082322;--card:#0E3433;--tx:#E3F8F6;--mu:#8FC4C0;--tl:#12433F;--bd:#1B5A56;--td:#81D8D0;color-scheme:dark}}
:root[data-theme=dark]{--bg:#082322;--card:#0E3433;--tx:#E3F8F6;--mu:#8FC4C0;--tl:#12433F;--bd:#1B5A56;--td:#81D8D0;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 15% 0,rgba(129,216,208,.4),transparent 50%),radial-gradient(ellipse at 95% 45%,rgba(201,167,232,.2),transparent 45%),radial-gradient(ellipse at 10% 90%,rgba(244,182,200,.18),transparent 45%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
svg{flex:none}
button,input,textarea,select{font-family:inherit}
label.btn{display:flex}
header{background:repeating-linear-gradient(105deg,rgba(255,255,255,.08) 0 14px,transparent 14px 48px),radial-gradient(circle at 50% 100%,transparent 0 9px,rgba(255,255,255,.2) 10px 11px,transparent 12px) 0 0/22px 14px,linear-gradient(170deg,#06505a,#0ABAB5 60%,#81D8D0);color:#fff;padding:22px 16px 36px;text-align:center;position:relative}
header .lg{display:flex;align-items:center;justify-content:center;gap:2px;max-width:100%;margin:0 auto}
header .lg .mm{width:96px;height:auto;flex:none;margin-bottom:22px;filter:drop-shadow(0 3px 8px #0005)}
header h1{margin:0;line-height:0}
header h1 img{width:200px;max-width:calc(100vw - 140px);height:auto;filter:drop-shadow(0 3px 8px #0005)}
header .sub{margin:2px auto 0;max-width:290px;font:600 17px/1.25 "Cormorant Garamond",Georgia,serif;font-variant-caps:small-caps;letter-spacing:.05em;text-wrap:balance;text-shadow:0 1px 6px #0004}
header .orn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px}
header .orn::before,header .orn::after{content:"";width:46px;height:1px;background:#fffb}
header .orn i{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bff3ee);box-shadow:0 0 6px #fff}
header>svg{position:absolute;left:0;bottom:-1px;width:100%;height:18px}
.tabs{display:flex;gap:8px;max-width:520px;margin:-14px auto 0;padding:0 14px;position:relative;z-index:2}
.tabs button{flex:1;padding:11px;border:1.5px solid var(--bd);border-radius:6px 22px 6px 22px;background:var(--card);color:var(--tx);font-weight:600;font-size:15px;box-shadow:0 2px 8px #0ABAB533;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.tabs button.on{background:linear-gradient(135deg,#06706C,#0ABAB5 55%,#81D8D0);color:#fff;border-color:transparent}
main{max-width:520px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #06505a24}
h2{margin:0 0 10px;font-size:17px;color:var(--td)}h3{margin:0 0 8px;font-size:17px}
h2 svg,h3 svg{vertical-align:-4px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.opt{--c:#0ABAB5;border:1.5px solid var(--c);background:transparent;color:var(--tx);border-radius:4px 16px 4px 16px;padding:7px 13px 7px 10px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
.chip::before,.opt::before{content:"";width:10px;height:10px;border-radius:50%;margin-right:7px;background:radial-gradient(circle at 32% 30%,#fff,#dff6f4 45%,var(--c) 130%);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.chip.on,.opt.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#81D8D0));color:#fff}
.chip.on::before,.opt.on::before{background:radial-gradient(circle at 32% 30%,#fff,#fff 55%,#ffffffcc);box-shadow:0 0 6px 1px #fff9}
.opt.sg{border-style:dashed;box-shadow:0 0 0 3px #81D8D066}.opt small{opacity:.75;margin-left:4px}
.btn{border:0;background:#81D8D0;color:#06404a;border-radius:6px 24px 6px 24px;padding:13px 18px;font-weight:700;font-size:15px;width:100%;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.t{background:linear-gradient(135deg,#06706C,#0ABAB5 60%,#81D8D0);color:#fff}.btn.s{width:auto;padding:9px 16px}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
input,textarea{font-size:15px;padding:9px 10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);min-width:0}
textarea{width:100%;min-height:70px}
.big{font-size:26px;font-weight:800;color:var(--td);display:flex;align-items:center;gap:8px}
.sec{margin-top:14px}.sec b{display:block;margin-bottom:6px;font-size:14px}.sec b svg{vertical-align:-3px;margin-right:4px}
.alert{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #06505a24}
ul{margin:6px 0 0;padding-left:20px}li{margin-bottom:5px}
.pill{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.pill span{flex:1}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin:6px 0 4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wk button,.cd{border:0;border-radius:4px 12px 4px 12px;background:var(--tl);color:var(--tx);font-weight:600;font-size:14px;position:relative;padding:0;cursor:pointer}
.cd{aspect-ratio:1}.wk button{padding:8px 0}
.cm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cm span{text-align:center;font-size:12px;color:var(--mu)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mh h2{margin:0;text-align:center;flex:1}
.arw{border:0;background:var(--tl);color:var(--td);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
#calbox{touch-action:pan-y}
.cm.in-r{animation:inr .25s ease-out}.cm.in-l{animation:inl .25s ease-out}@keyframes inr{from{opacity:.3;transform:translateX(30px)}}@keyframes inl{from{opacity:.3;transform:translateX(-30px)}}@media(prefers-reduced-motion:reduce){.cm.in-r,.cm.in-l{animation:none}}
.cd.per{background:#D6455D;color:#fff}.cd.ov{background:#0ABAB5;color:#fff}.cd.tp{box-shadow:inset 0 0 0 2px #B9A7F5}.cd.fe.tp{box-shadow:inset 0 0 0 2px #0ABAB5}.cd.pp{background:#F0A7B4;color:#5a1020}.cd.fe{box-shadow:inset 0 0 0 2px var(--t)}.cd.td,.wk .td{outline:3px solid #5fb8d6}.wk .sl{background:var(--t);color:#fff}
.cd.em{background:none;pointer-events:none}.cd u{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px;text-decoration:none}
.cd u i{width:5px;height:5px;border-radius:50%}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:5;justify-content:center}
#nav button{flex:1;max-width:110px;border:0;background:none;color:var(--mu);font-weight:600;font-size:12px;border-radius:4px 16px 4px 16px;padding:6px 2px;cursor:pointer}
details.fase{border-top:1px solid var(--bd);padding:10px 0}details.fase summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}details.fase summary::-webkit-details-marker{display:none}details.fase summary::after{content:"+";margin-left:auto;color:var(--mu);font-size:20px}details.fase[open] summary::after{content:"−"}details.fase p{margin:8px 0 0}
.tag{font-size:11px;font-weight:700;background:var(--t);color:#fff;border-radius:999px;padding:2px 8px}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th,.tb td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}.tb th{color:var(--mu);font-weight:600}
#lock{position:fixed;inset:0;z-index:50;background:linear-gradient(170deg,#06505a,#0ABAB5 70%,#81D8D0);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lkbox{width:min(340px,100%);display:flex;flex-direction:column;gap:12px;align-items:center;color:#fff;text-align:center}.lkbox h2{color:#fff;margin:0}.lkbox input{width:100%;text-align:center;font-size:22px;letter-spacing:.3em;background:#ffffffee;color:#0F3D3B;border:0}.lkbox .lnk{color:#fff}.lkbox .msg{background:#ffffff26;color:#fff}
@media print{:root{--card:#fff;--tx:#000;--mu:#444;--bd:#bbb;--td:#06706C;--bg:#fff}header,.tabs,#nav,.noprint,.demo,#lock{display:none!important}body{background:#fff!important;color:#000}main{padding:0}.card{box-shadow:none;border:0;padding:0}}
.msg{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--tl);color:var(--tx);font-size:14px}
.lnk{background:none;border:0;color:var(--td);font-weight:600;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px}
.fl{display:block;margin-top:10px}.fl input{display:block;width:100%;margin-top:4px}.btn[disabled]{opacity:.6}
#nav button span{display:flex;justify-content:center;margin-bottom:2px}#nav button.on{background:var(--tl);color:var(--td)}
</style></head><body>
